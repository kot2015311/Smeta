<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Расчёт сметы</title>
<meta name="robots" content="noindex">
<!-- Стили встроены: GitHub Pages показывает эту страницу по любому адресу, и относительные ссылки на файлы могут не сработать -->
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#ECEEF2;color:#131A33;font:400 17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .sheet{width:100%;max-width:640px;padding:clamp(24px,5vw,48px);border-radius:4px;background:#fff;box-shadow:0 1px 0 rgba(19,26,51,.05),0 22px 44px -26px rgba(19,26,51,.38)}
  svg{display:block;width:100%;height:auto;margin-bottom:24px}
  h1{margin:0 0 10px;font-size:clamp(28px,5vw,40px);line-height:1.1;letter-spacing:-.02em}
  p{margin:0 0 24px;color:#39405A}
  a{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;border-radius:10px;background:#2B47D6;color:#fff;font-weight:600;text-decoration:none}
  a:hover{background:#1F35A8}
  a:focus-visible{outline:3px solid #2B47D6;outline-offset:2px}
</style>
</head>
<body>
<main class="sheet">
  <svg viewBox="0 0 400 200" role="img" aria-label="Пустой зал: здесь пока никого нет">
    <path d="M214 190H390V10H10V190H186" fill="none" stroke="#131A33" stroke-width="2"/>
    <path d="M186 190V162A28 28 0 0 1 214 190" fill="none" stroke="#586079"/>
    <rect x="125" y="10" width="150" height="22" fill="#E9EDFC" stroke="#2B47D6" stroke-width="1.3"/>
    <text x="200" y="22" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#39405A" font-family="system-ui, sans-serif">Сцена</text>
    <text x="200" y="108" text-anchor="middle" dominant-baseline="central" font-size="34" fill="#B9BFCC" font-family="system-ui, sans-serif" font-weight="600">404</text>
  </svg>
  <h1>Здесь пока пусто</h1>
  <p>Такой страницы нет — возможно, ссылка устарела. Вернитесь на главную и посчитайте смету заново: это займёт минуту.</p>
  <a id="home" href="/">На главную</a>
</main>
<script>
  // Для сайта вида username.github.io/репозиторий/ главная — внутри папки репозитория.
  // Если сайт лежит в репозитории username.github.io (в корне домена), этот скрипт можно удалить.
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    if (/\.github\.io$/.test(location.hostname) && parts.length) document.getElementById('home').href = '/' + parts[0] + '/';
  })();
</script>
</body>
</html>
